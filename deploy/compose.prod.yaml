name: bank-event-gateway

services:
  gateway:
    image: ${IMAGE_REF:-ghcr.io/thedemontuan/tuan-acb-webhook-gateway:latest}
    container_name: bank-event-gateway
    restart: unless-stopped
    init: true
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      APP_ENV: production
      PORT: ${PORT:-8090}
      LISTEN_ADDR: 0.0.0.0:8090
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://bank.tuannguyenviet.site}
      DATA_DIR: /data
      DATABASE_PATH: /data/gateway.db
      TZ: Asia/Ho_Chi_Minh
      APP_MASTER_KEY: ${APP_MASTER_KEY:-}
      APP_MASTER_KEY_FILE: ${APP_MASTER_KEY_FILE:-/run/secrets/app_master_key}
      POLL_MIN_INTERVAL_SEC: ${POLL_MIN_INTERVAL_SEC:-10}
      POLL_MAX_INTERVAL_SEC: ${POLL_MAX_INTERVAL_SEC:-30}
      CLOUDFLARE_ACCESS_TEAM_NAME: ${CLOUDFLARE_ACCESS_TEAM_NAME:-thedemontuan}
      CLOUDFLARE_ACCESS_AUD: ${CLOUDFLARE_ACCESS_AUD:-}
      CF_ACCESS_ISSUER: ${CF_ACCESS_ISSUER:-https://${CLOUDFLARE_ACCESS_TEAM_NAME:-thedemontuan}.cloudflareaccess.com}
      CF_ACCESS_AUDIENCE: ${CF_ACCESS_AUDIENCE:-${CLOUDFLARE_ACCESS_AUD:-}}
      CF_ACCESS_JWKS_URL: ${CF_ACCESS_JWKS_URL:-https://${CLOUDFLARE_ACCESS_TEAM_NAME:-thedemontuan}.cloudflareaccess.com/cdn-cgi/access/certs}
      OWNER_SUBJECTS: ${OWNER_SUBJECTS:-${CLOUDFLARE_ACCESS_OWNER_EMAIL:-nguyenviettuanbp@gmail.com}}
      AUTH_BROWSER_URL: http://auth-browser:8181
      AUTH_BROWSER_VNC_URL: http://auth-browser:6080
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - gateway_data:/data:rw
      - ./secrets/app_master_key:/run/secrets/app_master_key:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    healthcheck:
      test: ["CMD", "/gateway", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 2s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
          pids: 100

  auth-browser:
    image: ${AUTH_BROWSER_IMAGE_REF:-ghcr.io/thedemontuan/tuan-acb-webhook-gateway-auth-browser:latest}
    container_name: bank-gateway-auth-browser
    restart: unless-stopped
    init: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp-auth-browser.json
    environment:
      HOME: /tmp
    expose: ["8181", "6080"]
    healthcheck:
      test: ["CMD", "/auth-browser", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g,mode=1777
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
          pids: 300

  cloudflared:
    image: cloudflare/cloudflared:2026.9.0
    container_name: bank-gateway-cloudflared
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set tunnel token}
    depends_on:
      gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 100

volumes:
  gateway_data:
