name: tuan-bank-gateway

services:
  gateway:
    image: ${IMAGE_REF:?Set an immutable gateway image digest}
    container_name: tuan-bank-gateway
    restart: unless-stopped
    init: true
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      APP_ENV: production
      LISTEN_ADDR: 0.0.0.0:8080
      DATA_DIR: /data
      DATABASE_PATH: /data/gateway.db
      TZ: Asia/Ho_Chi_Minh
      APP_MASTER_KEY_FILE: /run/secrets/app_master_key
      DEFAULT_POLL_INTERVAL_SEC: "15"
      FAST_POLL_INTERVAL_SEC: "5"
      CF_ACCESS_ISSUER: ${CF_ACCESS_ISSUER:?Set Cloudflare Access issuer}
      CF_ACCESS_AUDIENCE: ${CF_ACCESS_AUDIENCE:?Set Cloudflare Access audience}
      CF_ACCESS_JWKS_URL: ${CF_ACCESS_JWKS_URL:?Set Cloudflare Access JWKS URL}
    volumes:
      - gateway_data:/data:rw
      - ./secrets/app_master_key:/run/secrets/app_master_key:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    networks: [ingress_private, egress]
    healthcheck:
      test: ["CMD", "/gateway", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
          pids: 100

  cloudflared:
    image: cloudflare/cloudflared:2026.9.0
    container_name: tuan-bank-gateway-tunnel
    restart: unless-stopped
    init: true
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set tunnel token}
    depends_on:
      gateway:
        condition: service_healthy
    networks: [ingress_private, egress]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 100

# auth-browser is intentionally not included until PR 0 proves browser sandbox,
# authorized ACB login, and session handoff. It must never expose VNC/CDP ports.
volumes:
  gateway_data:

networks:
  ingress_private:
    internal: true
  egress: {}
