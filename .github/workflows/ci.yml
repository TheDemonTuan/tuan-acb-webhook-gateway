name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build and test frontend with Bun
        working-directory: web
        run: |
          bunx --bun tsc --noEmit
          bunx --bun vite build
          bunx --bun vitest run
      - name: Test Go gateway
        run: |
          go test -race ./...
          go vet ./...
      - name: Verify deployment scripts
        run: bash -n deploy/*.sh
      - name: Check generated source and whitespace
        run: git diff --check

  docker-smoke:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tuan-bank-gateway:smoke-test
          load: true
      - name: Run gateway image healthcheck
        run: |
          docker run --rm \
            -e APP_ENV=development \
            -e DATA_DIR=/tmp/data \
            tuan-bank-gateway:smoke-test --healthcheck
