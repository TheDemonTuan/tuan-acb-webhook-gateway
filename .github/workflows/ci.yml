name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build and test frontend with Bun
        working-directory: web
        run: |
          bunx --bun tsc --noEmit
          bunx --bun vite build
          bunx --bun vitest run
      - name: Test Go gateway
        run: |
          go test -race ./...
          go vet ./...
      - name: Verify deployment scripts
        run: bash -n deploy/*.sh
      - name: Check generated source and whitespace
        run: git diff --check

  docker-smoke:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: tuan-bank-gateway:smoke-test
          load: true
      - name: Run gateway image smoke test
        run: |
          docker run -d --name smoke-test \
            -e APP_ENV=development \
            -e LISTEN_ADDR=0.0.0.0:8080 \
            -e DATA_DIR=/tmp/data \
            tuan-bank-gateway:smoke-test
          sleep 2
          docker exec smoke-test /gateway --healthcheck
          docker stop smoke-test
          docker rm -f smoke-test
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.auth-browser
          push: false
          tags: tuan-bank-gateway-auth-browser:smoke-test
          load: true
      - name: Run auth-browser image smoke test
        run: |
          chmod +x deploy/smoke-test-auth-browser.sh
          ./deploy/smoke-test-auth-browser.sh tuan-bank-gateway-auth-browser:smoke-test
