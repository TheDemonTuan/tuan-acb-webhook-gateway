name: Build and Deploy
run-name: ${{ inputs.skip_deploy && 'Build image only' || 'Build GHCR image and deploy VPS' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: Build and publish without deploying
        required: false
        type: boolean
        default: false

concurrency:
  group: bank-event-gateway-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: tuan-acb-email-webhook

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify source
        run: |
          set -euo pipefail
          npm run lint
          npm test
          npm run build
      - name: Verify deployment scripts
        run: |
          set -euo pipefail
          bash -n deploy/deploy.sh deploy/rollback.sh deploy/verify-deployment.sh deploy/image-retention.sh

  image:
    name: Build GHCR image
    needs: verify
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.10.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner_lc="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=${{ env.REGISTRY }}/${owner_lc}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.15.0
        with:
          context: .
          push: true
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/arm64' }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save immutable image reference
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p digests
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > digests/gateway
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: gateway-digest
          path: digests/gateway
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to VPS
    needs: [verify, image]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_deploy) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.9
        with:
          name: gateway-digest
          path: digests
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Sync deployment files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/bank-event-gateway' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "mkdir -p '$DEPLOY_PATH/data' '$DEPLOY_PATH/credentials' '$DEPLOY_PATH/secrets'"
          scp -i ~/.ssh/id_ed25519 -P "$VPS_PORT" -o BatchMode=yes \
            deploy/compose.prod.yaml deploy/deploy.sh deploy/rollback.sh \
            deploy/verify-deployment.sh deploy/image-retention.sh \
            "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "chmod 750 '$DEPLOY_PATH/deploy.sh' '$DEPLOY_PATH/rollback.sh' '$DEPLOY_PATH/verify-deployment.sh' '$DEPLOY_PATH/image-retention.sh'"
      - name: Deploy immutable image
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/bank-event-gateway' }}
        run: |
          set -euo pipefail
          image_ref="$(cat digests/gateway)"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "cd '$DEPLOY_PATH' && ./deploy.sh '$image_ref'"
