name: Build and deploy gateway

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the immutable image to the configured VPS
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: tuan-bank-gateway-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    needs: image
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload deployment manifests only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/tuan-bank-gateway' }}
        run: |
          set -euo pipefail
          tar -C deploy -czf /tmp/deploy.tgz compose.prod.yaml deploy.sh rollback.sh verify-deployment.sh backup.sh README.md
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "mkdir -p '$DEPLOY_PATH/deploy'"
          scp -i ~/.ssh/id_ed25519 -P "$VPS_PORT" -o BatchMode=yes /tmp/deploy.tgz "$VPS_USER@$VPS_HOST:/tmp/tuan-bank-gateway-deploy.tgz"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "tar -xzf /tmp/tuan-bank-gateway-deploy.tgz -C '$DEPLOY_PATH/deploy' && rm /tmp/tuan-bank-gateway-deploy.tgz && chmod 700 '$DEPLOY_PATH/deploy/'*.sh"
      - name: Deploy immutable digest
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/tuan-bank-gateway' }}
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}@${{ needs.image.outputs.digest }}"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "cd '$DEPLOY_PATH/deploy' && ./deploy.sh '$image'"
